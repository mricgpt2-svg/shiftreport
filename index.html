<script>
(function(){'use strict';

function stash(){if(!el('produced'))return;['produced','loaded','rolling','operator','notes'].forEach(k=>{if(el(k))draft[k]=el(k).value});['hot','box'].forEach(k=>{if(el(k))draft[k]=el(k).checked});try{localStorage.setItem('shiftreport_v61_draft',JSON.stringify({phase,shift,draft,marks,cuts}))}catch(e){showError(e)}}
function render(){if(page==='boot'){document.querySelector('.nav').style.display='none';el('view').innerHTML='<main class="wrap" style="min-height:75vh;display:flex;align-items:center;justify-content:center"><div class="card" role="status" aria-live="polite" style="text-align:center;width:100%;max-width:420px"><h2>گزارش کار انبار شمش</h2><p class="muted">در حال بررسی ورود...</p></div></main>';return}if(!access&&!['login','otp','pending','inactive'].includes(page))page='login';document.querySelector('.nav').style.display=access?'flex':'none';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let h='';
if(page==='home')h='<header><h1>گزارش کار انبار شمش</h1><p>مجتمع فولاد خراسان</p></header><main class="wrap"><div class="card">'+esc(access?access.full_name:'')+' • '+esc(access?(access.role==='owner'?'مالک اصلی':access.role):'')+' <button class="btn secondary" onclick="logoutWeb()">خروج</button></div>'+warning+'<div class="card"><h2>انتخاب شیفت</h2><div class="shiftgrid">'+[['A','#1f9b61'],['B','#1768cf'],['C','#f07815'],['D','#6b3db8']].map(x=>'<button class="shift '+(shift===x[0]?'selected':'')+'" style="background:'+x[1]+'" onclick="setShift(\''+x[0]+'\')">شیفت '+x[0]+'</button>').join('')+'</div></div><div class="card"><h2>انتخاب فاز گزارش</h2><div class="row"><button class="btn phase '+(phase==='1'?'active':'')+'" onclick="setPhase(\'1\')">فاز ۱</button><button class="btn phase '+(phase==='2'?'active':'')+'" onclick="setPhase(\'2\')">فاز ۲</button></div></div>'+(access&&(access.role==='owner'||access.user_type==='shift')?'<button class="action" onclick="go(\'form\')">＋ ثبت گزارش فاز '+phase+' • شیفت '+shift+'</button>':'<div class="card"><p class="muted">ثبت گزارش برای نقش شما فعال نیست.</p></div>')+'<button class="action orange" onclick="go(\'notices\')">📢 اطلاعیه‌ها</button><button class="action purple" onclick="go(\'swaps\')">⇄ جانشینی و تعویض شیفت</button><div class="card"><h2>آخرین گزارش‌ها</h2><div id="recentReports">'+recentReportsHtml()+'</div></div></main>';
if(page==='form')h=topBar((editingReportId?'ویرایش گزارش':'ثبت گزارش')+' فاز '+phase+' • شیفت '+shift)+'<main class="wrap">'+warning+'<section class="section bluebg"><h3>⚗ تولید و بارگیری</h3>'+field('produced','تعداد ذوب تولیدشده')+field('loaded','بارگیری ماشین')+'</section><section class="section peach"><h3>▰ ارسال به نورد</h3>'+field('rolling','تعداد ذوب ارسالی')+'</section>'+(phase==='1'?'<section class="section peach"><h3>🔥 عملیات فاز ۱</h3><label class="check"><input id="hot" type="checkbox" '+(draft.hot?'checked':'')+'>هات شارژ انجام شد</label><label class="check"><input id="box" type="checkbox" '+(draft.box?'checked':'')+'>تخلیه باکس انجام شد</label></section>':'')+'<section class="section greenbg"><h3>◆ مارک‌گذاری (لیبل / شابلون)</h3><button class="btn" onclick="addMark()">＋ افزودن مورد</button><div class="small">نوع | تعداد ذوب | کوپه</div><div id="marks">'+marks.map(markRow).join('')+'</div></section><section class="section pink"><h3>✂ برشکاری</h3>'+operatorSelect()+'<div class="small">نوع برش | تعداد | شماره ذوب</div><div id="cuts">'+cuts.map(cutRow).join('')+'</div><button class="btn" style="margin-top:14px" onclick="addCut()">＋ افزودن برش</button></section><section class="section violet"><h3>🔧 اتفاقات / خرابی‌ها / تعمیرات و توضیحات شیفت</h3><textarea id="notes" placeholder="توضیحات شیفت...">'+esc(draft.notes||'')+'</textarea></section><button class="btn green wide" onclick="submitReport()">'+(editingReportId?'ذخیره تغییرات گزارش':'ثبت و ارسال گزارش به سرور')+'</button><button class="btn wide" onclick="saveDraft()">ذخیره پیش‌نویس روی گوشی</button><p id="submitStatus" class="hint" role="status"></p></main>';
if(page==='pending')h=topBar('در انتظار تأیید مدیر')+'<main class="wrap"><div class="card"><h2>در انتظار تأیید مدیر</h2><p>کد پیامکی تأیید شد، اما این دستگاه هنوز توسط مالک یا مدیر تأیید و فعال نشده است.</p><button class="btn wide" onclick="checkDevice()">بررسی مجدد وضعیت</button><button class="btn secondary wide" onclick="logoutWeb()">خروج</button><p id="deviceStatus" class="hint"></p></div></main>';
if(page==='inactive')h=topBar('دستگاه غیرفعال')+'<main class="wrap"><div class="card"><h2>دسترسی غیرفعال است</h2><p>این دستگاه توسط مدیر غیرفعال یا رد شده است.</p><button class="btn wide" onclick="checkDevice()">بررسی مجدد</button><button class="btn secondary wide" onclick="logoutWeb()">خروج</button><p id="deviceStatus" class="hint"></p></div></main>';
if(page==='login')h=topBar('ورود کاربران')+'<main class="wrap"><div class="card"><h2>ورود با پیامک</h2><p class="hint">نام و شماره موبایل تعریف‌شده توسط مدیر در برنامه اندروید را وارد کنید. درخواست واقعی به Supabase فرستاده می‌شود. پس از تأیید کد، وضعیت تأیید و فعال بودن دستگاه بررسی می‌شود.</p><label for="loginName">نام و نام خانوادگی</label><input id="loginName" autocomplete="name" placeholder="نام ثبت‌شده نزد مدیر" value="'+esc(pendingName)+'"><label for="loginMobile">شماره موبایل</label><input id="loginMobile" type="tel" inputmode="tel" autocomplete="tel" placeholder="09xxxxxxxxx" value="'+esc(pendingMobile)+'"><button id="requestBtn" class="btn wide" onclick="requestOtp()">دریافت کد تأیید</button><div id="otpPreview" class="hint" role="status" aria-live="polite"></div></div></main>';
if(page==='otp')h=topBar('تأیید شماره موبایل')+'<main class="wrap"><div class="card"><h2>کد تأیید چهاررقمی</h2><p>کد ارسال‌شده به '+esc(pendingMobile)+' را وارد کنید.</p><label for="otpCode">کد چهاررقمی</label><input id="otpCode" inputmode="numeric" autocomplete="one-time-code" maxlength="4" placeholder="••••"><button id="verifyBtn" class="btn green wide" onclick="verifyOtp()">تأیید کد</button><button class="btn secondary wide" onclick="go(&quot;login&quot;)">اصلاح شماره موبایل</button><div id="otpPreview" class="hint" role="status" aria-live="polite"></div></div></main>';

if(page==='operators')h=topBar('مدیریت اپراتورها')+'<main class="wrap">'+warning+'<div class="card"><h2>فهرست اپراتورهای برشکاری</h2><p class="hint">هر نام را در یک خط وارد کنید. این تغییرات فقط روی همین مرورگر ذخیره می‌شوند.</p><textarea id="operatorNames" class="manage">'+esc(operators.join('\n'))+'</textarea><button class="btn green wide" onclick="saveOperators()">ذخیره فهرست اپراتورها</button><button class="btn wide" onclick="resetOperators()">بازگرداندن نام‌های پیش‌فرض</button></div></main>';
if(page==='reports')h=topBar('گزارش‌ها')+'<main class="wrap"><div class="row report-tabs"><button id="filter1" class="btn" onclick="setReportFilter(\'1\')">گزارش‌های فاز ۱</button><button id="filter2" class="btn" onclick="setReportFilter(\'2\')">گزارش‌های فاز ۲</button></div><div id="reportList">'+reportCards()+'</div></div></main>';
if(page==='stats')h=topBar('آمار گزارش‌ها')+'<main class="wrap"><div class="card"><div id="statsContent">'+statsHtml()+'</div></div></main>';
if(page==='settings'||page==='notices'||page==='swaps'){let names={settings:'تنظیمات',notices:'اطلاعیه‌ها',swaps:'جانشینی و تعویض شیفت'};h=topBar(names[page])+'<main class="wrap">'+warning+'<div class="card"><h2>'+names[page]+'</h2><p>این بخش در نسخه‌های بعدی تکمیل می‌شود.</p></div>'+(page==='settings'?'<button class="btn secondary wide" onclick="go(&quot;operators&quot;)">⚙ مدیریت نام اپراتورها</button><button class="btn wide" onclick="clearDraft()">پاک‌کردن پیش‌نویس</button>':'')+'</main>'}

el('view').innerHTML=h}
window.go=safe(p=>{if(access&&['home','form','reports','stats','settings','notices','swaps'].includes(p))checkDevice().catch(()=>{});if(!access&&!['login','otp','pending','inactive'].includes(p))return;if(p==='form'&&access&&access.role!=='owner'&&access.user_type!=='shift')return;if(page==='form'&&p!=='form'){if(editingReportId){editingReportId=null;editingOriginal=null;draft={};}else stash();}page=p;render();if(p==='reports'){updateReportTabs();refreshReports()}else if(p==='stats'||p==='home')refreshReports();window.scrollTo(0,0)});
window.setPhase=safe(p=>{if(!access)return;phase=p;marks.forEach(m=>m.coupe=validCoupe(m.coupe));render()});window.setShift=safe(s=>{if(access&&access.role!=='owner'&&access.shift!==s)return;shift=s;render()});

const SB_URL='https://aiezzysdxatuhmlbofga.supabase.co';
const SB_KEY='sb_publishable_ZYb-9Pn9ebxuQrFsRA2l5g_f7BfaVGC';
let pendingName='',pendingMobile='';
const REMEMBER_KEY='shiftreport_web_verified_device_v71';
function rememberVerifiedDevice(){try{localStorage.setItem(REMEMBER_KEY,JSON.stringify({deviceId:browserDeviceId(),verifiedAt:Date.now()}))}catch(e){showError(e)}}

async function otpRpc(name,payload){let res=await fetch(SB_URL+'/rest/v1/rpc/'+name,{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json','x-device-id':browserDeviceId()},body:JSON.stringify(payload)});let data=await res.json().catch(()=>({message:'پاسخ نامعتبر از سرور'}));if(!res.ok)throw Error(data.message||data.error||'خطای سرور ('+res.status+')');return data}
function otpMessage(t){let x=el('otpPreview');if(x)x.textContent=t}
window.requestOtp=async()=>{let n=(el('loginName').value||'').trim(),m=digits(el('loginMobile').value).trim();if(n.length<3||!/^09\d{9}$/.test(m)){otpMessage('نام و شماره موبایل ۱۱ رقمی را صحیح وارد کنید.');return}pendingName=n;pendingMobile=m;let b=el('requestBtn');b.disabled=true;otpMessage('در حال درخواست کد از سرور...');try{let r=await otpRpc('request_app_otp',{p_full_name:n,p_mobile:m,p_device_id:browserDeviceId()});if(r&&r.ok){page='otp';render()}else otpMessage((r&&r.message)||'سرور درخواست کد را نپذیرفت.')}catch(e){otpMessage('درخواست انجام نشد: '+e.message+' — ممکن است سرور شناسه دستگاه وب را نپذیرد یا دسترسی مرورگر مسدود باشد.')}finally{if(b.isConnected)b.disabled=false}};
window.verifyOtp=async()=>{let c=digits(el('otpCode').value).trim();if(!/^\d{4}$/.test(c)){otpMessage('کد چهاررقمی را کامل وارد کنید.');return}let b=el('verifyBtn');b.disabled=true;otpMessage('در حال بررسی کد...');try{let r=await otpRpc('verify_app_otp',{p_mobile:pendingMobile,p_device_id:browserDeviceId(),p_code:c});if(r&&r.ok){otpMessage('کد تأیید شد؛ در حال بررسی وضعیت دستگاه...');rememberVerifiedDevice();await checkDevice(true)}else otpMessage((r&&r.message)||'کد تأیید نشد.')}catch(e){otpMessage('خطا در تأیید: '+e.message)}finally{if(b.isConnected)b.disabled=false}};


// V7.2: remember successful OTP for this browser, then recheck server approval on every launch.
// This is NOT a cryptographically secure session; backend-issued revocable tokens are still required.
async function readDevice(){let id=browserDeviceId();let url=SB_URL+'/rest/v1/shift_devices?device_id=eq.'+encodeURIComponent(id)+'&select=device_id,shift,role,active,full_name,approval_status,user_type&limit=1';let res=await fetch(url,{headers:{'apikey':SB_KEY,'x-device-id':id},cache:'no-store'});if(!res.ok)throw Error('خطای بررسی دستگاه ('+res.status+')');let a=await res.json();return a.length?a[0]:null}
window.checkDevice=async function(afterOtp=false){const originalAccess=access;let msg=el('deviceStatus');if(msg)msg.textContent='در حال بررسی وضعیت...';try{let d=await readDevice();if(!afterOtp&&access!==originalAccess)return;if(!d){access=null;page='pending'}else if(d.approval_status!=='approved'||!d.active){access=null;page=d.approval_status==='pending'?'pending':'inactive'}else if(afterOtp||access||hasRememberedDevice()){access={role:d.role||'user',shift:d.shift||'',user_type:d.user_type||'shift',full_name:d.full_name||''};if(access.role!=='owner'&&access.shift)shift=access.shift;if(afterOtp||page==='login'||page==='boot')page='home'}else{access=null;page='login'}render();if(page==='home'&&access)refreshReports()}catch(e){if(msg)msg.textContent=e.message;else if(page==='boot'){page='login';render();otpMessage('بررسی خودکار ورود انجام نشد؛ اتصال اینترنت را بررسی کنید.')}else otpMessage('کد تأیید شد، اما بررسی دستگاه انجام نشد: '+e.message)}};
window.logoutWeb=()=>{forgetVerifiedDevice();access=null;pendingName='';pendingMobile='';page='login';render()};

function num(x){const n=Number(digits(x));return Number.isSafeInteger(n)&&n>=0?n:0}
function newReportId(){return crypto.randomUUID?crypto.randomUUID(): 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.floor(Math.random()*16);return (c==='x'?r:(r&3|8)).toString(16)})}
function cycleStatusForReport(r){
 const c=['صبح‌کار اول','صبح‌کار دوم','عصرکار اول','عصرکار دوم','شب‌کار اول','شب‌کار دوم','آف اول','آف دوم'];
 const base={A:4,B:6,C:0,D:2}; if(!(r.shift in base))return 'نامشخص';
 // Android V54 anchor: 2026-09-20, using Tehran calendar day.
 let day='';if(r.tehran_time){const d=new Date(r.tehran_time);if(!isNaN(d))day=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tehran',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}
 if(!day){const d=new Date();day=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tehran',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}
 const m=day.match(/(\d{4})-(\d{2})-(\d{2})/);if(!m)return 'نامشخص';
 const diff=Math.round((Date.UTC(+m[1],+m[2]-1,+m[3])-Date.UTC(2026,8,20))/86400000);
 return c[((base[r.shift]+diff)%8+8)%8];
}
window.editWebReport=async id=>{
 const r=reports.find(x=>String(x.id)===String(id));if(!r||!access)return;
 if(String(r.owner_device_id||'')!==browserDeviceId())return alert('فقط گزارش ثبت‌شده با همین دستگاه قابل ویرایش است.');
 try{const d=await readDevice();if(!d||!d.active||d.approval_status!=='approved')throw Error('دستگاه تأییدشده نیست');}
 catch(e){return alert('ویرایش مجاز نیست: '+e.message)}
 editingReportId=String(r.id);editingOriginal=structuredClone(r);phase=String(r.phase);shift=String(r.shift);
 draft={produced:String(r.produced_melts??0),loaded:String(r.loaded_trucks??0),rolling:String(r.rolling_count??0),hot:!!r.hot_charge,box:!!r.box_unloading,operator:r.cut_operator||operators[0],notes:r.notes||''};
 marks=Array.isArray(r.marks)&&r.marks.length?r.marks.map(m=>({...m})): [{type:'لیبل',count:'',coupe:phase==='1'?'C1':'D1'}];
 cuts=Array.isArray(r.cuts)&&r.cuts.length?r.cuts.map(c=>({...c})): [{type:'شمش',count:'',melt:''}];
 if(!operators.includes(draft.operator))operators.push(draft.operator);
 page='form';render();window.scrollTo(0,0);
};
function nowTehranIso(){return new Date().toISOString()}
function nowJalali(){const d=new Date();const date=new Intl.DateTimeFormat('fa-IR-u-ca-persian-nu-latn',{timeZone:'Asia/Tehran',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);const time=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Tehran',hour:'2-digit',minute:'2-digit',hour12:false}).format(d);return digits(date)+' — '+time}
async function api(path,opts={}){const r=await fetch(SB_URL+'/rest/v1/'+path,{...opts,headers:{'apikey':SB_KEY,'x-device-id':browserDeviceId(),...(opts.body?{'Content-Type':'application/json'}:{}),...(opts.headers||{})},cache:'no-store'});let raw=await r.text();let data;try{data=raw?JSON.parse(raw):null}catch{data=raw}if(!r.ok)throw Error((data&&(data.message||data.error))||'خطای سرور '+r.status);return data}
function reportCards(){
 if(loadingReports)return '<p>در حال دریافت گزارش‌ها...</p>';
 if(reportsError)return '<p class="alert">'+esc(reportsError)+'</p>';
 const rows=reports.filter(r=>String(r.phase)===reportFilter);
 if(!rows.length)return '<p class="muted">هنوز گزارشی برای این فاز ثبت نشده است.</p>';
 return rows.map(r=>{
  const jal=String(r.jalali||''), parts=jal.split('—'),date=parts[0].trim(),time=(parts[1]||'').trim();
  const role=r._reporter_role||'', type=r._reporter_user_type||'';
  const label=role==='owner'?'سرور':type==='supervisor'?'سرپرست':type==='chief'?'رئیس':type==='expert'?'کارشناس':'تکنسین';
  const reporter=esc(r.reporter_name||'نام ثبت‌کننده موجود نیست');
  const marksHtml=(Array.isArray(r.marks)?r.marks:[]).map(m=>'<p>'+esc(m.type||'مارک‌گذاری')+': '+num(m.count)+' ذوب • کوپه '+esc(m.coupe||'—')+'</p>').join('');
  const cutsHtml=(Array.isArray(r.cuts)?r.cuts:[]).map(c=>'<p>'+esc(c.type||'برش')+' • '+num(c.count)+' عدد • ذوب '+esc(c.melt||'—')+'</p>').join('');
  const isMine=!!access&&String(r.owner_device_id||'')===browserDeviceId();
  const canDelete=!!access&&(access.role==='owner'||access.role==='admin');
  const phase1=String(r.phase)==='1';
  return '<article class="card report-detail"><h3 class="report-heading">فاز '+esc(r.phase)+' • شیفت '+esc(r.shift)+' • تاریخ '+esc(date)+(time?' • ساعت '+esc(time):'')+'</h3>'+
   '<p><strong>چرخه کاری: '+esc(r.cycle_status||cycleStatusForReport(r))+'</strong></p>'+
   '<p><strong>'+label+': '+reporter+'</strong>'+(r.is_delegate?' • جانشین شیفت '+esc(r.shift):'')+'</p>'+
   '<p>تولید: '+num(r.produced_melts)+' ذوب | بارگیری: '+num(r.loaded_trucks)+' دستگاه</p>'+
   '<p>ارسال به نورد: '+num(r.rolling_count)+' ذوب</p>'+
   (phase1?'<p>هات شارژ: '+(r.hot_charge?'✓ انجام شد':'✗ انجام نشد')+' | تخلیه باکس: '+(r.box_unloading?'✓ انجام شد':'✗ انجام نشد')+'</p>':'')+
   marksHtml+'<p>اپراتور برشکاری: '+esc(r.cut_operator||'—')+'</p>'+cutsHtml+
   (r.notes?'<p>توضیحات: '+esc(r.notes)+'</p>':'')+
   (isMine?'<button class="btn wide" onclick="editWebReport(\''+esc(r.id||'')+'\')">✎ ویرایش گزارش خودم</button>':'')+
   (canDelete?'<button class="btn danger report-delete" onclick="deleteWebReport(\''+esc(r.id||'')+'\')">حذف گزارش</button>':'')+
   '</article>';
 }).join('');
}
function recentReportsHtml(){
 if(!reports.length){if(loadingReports)return '<p class="recent-msg">در حال دریافت آخرین گزارش‌ها...</p>';if(reportsError)return '<p class="recent-msg">دریافت گزارش‌ها ناموفق بود: '+esc(reportsError)+'</p>';return '<p class="recent-msg">هنوز گزارشی ثبت نشده است.</p>'}
 const colors={A:'#1f9b61',B:'#1768cf',C:'#f07815',D:'#6b3db8'};
 return '<div class="recent-list">'+reports.slice().sort((a,b)=>String(b.created_at||b.tehran_time||'').localeCompare(String(a.created_at||a.tehran_time||''))).slice(0,4).map(r=>{
  const color=colors[r.shift]||'#586a7e';
  const date=String(r.jalali||'').split('—')[0].trim()||'تاریخ نامشخص';
  return '<div class="recent-item" style="color:'+color+'"><span class="recent-dot" style="background:'+color+'"></span><span>شیفت '+esc(r.shift||'—')+' • تاریخ <span class="recent-date">'+esc(date)+'</span></span></div>';
 }).join('')+'</div>';
}
function updateRecentReports(){const x=el('recentReports');if(x)x.innerHTML=recentReportsHtml()}
function statsHtml(){if(loadingReports)return '<p>در حال دریافت آمار...</p>';if(reportsError)return '<p class="alert">'+esc(reportsError)+'</p>';const sum=k=>reports.reduce((a,r)=>a+num(r[k]),0);return '<h3>آمار '+reports.length+' گزارش دریافت‌شده</h3><p>تولید ذوب: '+sum('produced_melts')+'</p><p>بارگیری ماشین: '+sum('loaded_trucks')+'</p><p>ارسال به نورد: '+sum('rolling_count')+'</p><p>هات شارژ: '+reports.filter(r=>r.hot_charge).length+'</p><p>تخلیه باکس: '+reports.filter(r=>r.box_unloading).length+'</p><p>مارک‌گذاری: '+reports.reduce((a,r)=>a+(Array.isArray(r.marks)?r.marks.reduce((b,m)=>b+num(m.count),0):0),0)+'</p><p>برشکاری: '+reports.reduce((a,r)=>a+(Array.isArray(r.cuts)?r.cuts.reduce((b,m)=>b+num(m.count),0):0),0)+'</p><p class="small">این آمار بر اساس حداکثر ۲۰۰ گزارش آخر دریافتی است.</p>'}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&access&&(page==='home'||page==='reports'||page==='stats'))refreshReports()});
window.setReportFilter=v=>{reportFilter=v;updateReportTabs();const x=el('reportList');if(x)x.innerHTML=reportCards()};
function updateReportTabs(){for(const p of ['1','2']){const b=el('filter'+p);if(b)b.classList.toggle('active',reportFilter===p)}}
window.refreshReports=async()=>{if(!access)return;loadingReports=true;reportsError='';if(el('reportList'))el('reportList').innerHTML=reportCards();if(el('statsContent'))el('statsContent').innerHTML=statsHtml();updateRecentReports();try{reports=await api('shift_reports?select=*&order=created_at.desc&limit=200');if(!Array.isArray(reports))throw Error('پاسخ گزارش‌ها نامعتبر است')}catch(e){reportsError=e.message}finally{loadingReports=false;if(el('reportList'))el('reportList').innerHTML=reportCards();if(el('statsContent'))el('statsContent').innerHTML=statsHtml();updateRecentReports()}};

window.deleteWebReport=async id=>{
 if(!access||!['owner','admin'].includes(access.role))return alert('مجوز حذف گزارش ندارید.');
 const r=reports.find(x=>String(x.id)===String(id));if(!r)return;
 if(!confirm('حذف گزارش فاز '+r.phase+'، شیفت '+r.shift+' در تاریخ '+(r.jalali||'')+'؟\nاین عمل قابل بازگشت نیست.'))return;
 try{
  const deleted=await api('shift_reports?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:{Prefer:'return=representation'}});
  if(!Array.isArray(deleted)||!deleted.some(x=>String(x.id)===String(id)))throw Error('سرور حذف این گزارش را تأیید نکرد؛ مجوز حذف را بررسی کنید.');
  reports=reports.filter(x=>String(x.id)!==String(id));
  const x=el('reportList');if(x)x.innerHTML=reportCards();
  alert('گزارش حذف شد.');
 }catch(e){alert('حذف انجام نشد: '+e.message)}
};
let submittingReport=false;
window.submitReport=async()=>{
 if(submittingReport||!access||!(access.role==='owner'||access.user_type==='shift'))return;
 stash();
 if(!confirm(editingReportId?'تغییرات این گزارش در سرور ذخیره شود؟':'گزارش به سرور مشترک ارسال شود؟'))return;
 submittingReport=true;
 const submitButton=document.querySelector('button[onclick="submitReport()"]');
 if(submitButton){submitButton.disabled=true;submitButton.textContent='در حال ثبت گزارش...'}
 const status=el('submitStatus');if(status)status.textContent='در حال ارسال گزارش به سرور...';
 const payload={id:editingReportId||newReportId(),phase,shift,tehran_time:editingOriginal?.tehran_time||nowTehranIso(),jalali:editingOriginal?.jalali||nowJalali(),produced_melts:num(draft.produced),loaded_trucks:num(draft.loaded),rolling_count:num(draft.rolling),hot_charge:phase==='1'&&!!draft.hot,box_unloading:phase==='1'&&!!draft.box,reporter_name:editingOriginal?.reporter_name||access.full_name||pendingName,marks:marks.filter(m=>num(m.count)>0).map(m=>({type:m.type,count:num(m.count),coupe:validCoupe(m.coupe)})),cut_operator:draft.operator||operators[0],cuts:cuts.filter(c=>num(c.count)>0||String(c.melt||'').trim()).map(c=>({type:c.type,count:num(c.count),melt:String(c.melt||'').trim()})),notes:draft.notes||'',owner_device_id:editingOriginal?.owner_device_id||browserDeviceId(),owner_shift:editingOriginal?.owner_shift||shift,is_delegate:editingOriginal?.is_delegate||false,cycle_status:editingOriginal?.cycle_status||cycleStatusForReport({shift,tehran_time:nowTehranIso()})};
 try{
   // Check current device approval without rerendering the form or losing its values.
   const device=await readDevice();
   if(!device||device.approval_status!=='approved'||!device.active)throw Error('دستگاه در سرور تأیید یا فعال نیست');
   if(editingReportId){
     // Only patch editable columns, preserving report identity, ownership and timestamps.
     const {produced_melts,loaded_trucks,rolling_count,hot_charge,box_unloading,marks,cut_operator,cuts,notes}=payload;
     const changed={produced_melts,loaded_trucks,rolling_count,hot_charge,box_unloading,marks,cut_operator,cuts,notes};
     const updated=await api('shift_reports?id=eq.'+encodeURIComponent(editingReportId)+'&owner_device_id=eq.'+encodeURIComponent(browserDeviceId()),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify(changed)});
     if(!Array.isArray(updated)||!updated.some(r=>String(r.id)===editingReportId))throw Error('سرور ویرایش را تأیید نکرد؛ دسترسی ویرایش را بررسی کنید.');
   }else await api('shift_reports',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(payload)});
   // POST succeeded. Fetch again, without a manual refresh button.
   reportsError='';reports=[{...(editingOriginal||{}),...payload},...reports.filter(r=>r.id!==payload.id)].slice(0,200);
   let syncError='';
   try{const fresh=await api('shift_reports?select=*&order=created_at.desc&limit=200');if(!Array.isArray(fresh))throw Error('پاسخ نامعتبر');reports=fresh;if(!fresh.some(r=>r.id===payload.id))syncError='گزارش ثبت شد، ولی در فهرست دریافتی دیده نشد؛ مجوز خواندن سرور را بررسی کنید.'}
   catch(e){syncError='گزارش ثبت شد ولی همگام‌سازی فهرست ناموفق بود: '+e.message}
   editingReportId=null;editingOriginal=null;localStorage.removeItem('shiftreport_v61_draft');draft={};marks=[{type:'لیبل',count:'',coupe:'C1'}];cuts=[{type:'شمش',count:'',melt:''}];
   reportFilter=String(phase);page='reports';render();updateReportTabs();
   if(syncError){reportsError='';const x=el('reportList');if(x)x.insertAdjacentHTML('afterbegin','<p class="alert">'+esc(syncError)+'</p>')}
   else{const x=el('reportList');if(x)x.insertAdjacentHTML('afterbegin','<p class="hint">گزارش با موفقیت ثبت و فهرست خودکار به‌روز شد ✓</p>')}
 }catch(e){
   const x=el('submitStatus');if(x)x.textContent='گزارش ثبت نشد: '+e.message+' — اطلاعات فرم حفظ شده است.';
 }finally{submittingReport=false;const b=document.querySelector('button[onclick="submitReport()"]');if(b){b.disabled=false;b.textContent='ثبت و ارسال گزارش به سرور'}}
};
window.saveDraft=safe(()=>{if(!access){page='login';render();return}stash();alert('پیش‌نویس روی همین گوشی ذخیره شد؛ به سرور ارسال نشده است.')});
window.clearDraft=safe(()=>{if(confirm('پیش‌نویس پاک شود؟')){localStorage.removeItem('shiftreport_v61_draft');draft={};marks=[{type:'لیبل',count:'',coupe:'C1'}];cuts=[{type:'شمش',count:'',melt:''}];render()}});
try{let custom=JSON.parse(localStorage.getItem('shiftreport_v62_operators')||'null');if(Array.isArray(custom)&&custom.length)operators=custom.filter(x=>typeof x==='string'&&x.trim());let saved=JSON.parse(localStorage.getItem('shiftreport_v61_draft')||'null');if(saved){phase=saved.phase||'1';shift=saved.shift||'D';draft=saved.draft||{};if(Array.isArray(saved.marks))marks=saved.marks;if(Array.isArray(saved.cuts))cuts=saved.cuts;marks.forEach(m=>m.coupe=validCoupe(m.coupe));cuts.forEach(c=>{if(!CUT_TYPES.includes(c.type))c.type='شمش'})}}catch(e){showError(e)}
try{if(hasRememberedDevice()){page='boot';render();checkDevice().catch(e=>{page='login';render();showError(e)})}else{page='login';render()}}catch(e){page='login';render();showError(e)}
})();
</script></body></html>
