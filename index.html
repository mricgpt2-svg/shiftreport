<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>گزارش کار انبار شمش V6.2</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#182c47;font-family:Tahoma,Arial,sans-serif;padding-bottom:95px}button,input,textarea,select{font:inherit}button{border:0;cursor:pointer}header{background:linear-gradient(110deg,#27313a,#f16d00);color:#fff;padding:38px 16px 27px;border-radius:0 0 25px 25px;text-align:center}h1{font-size:25px}.wrap{padding:16px;max-width:780px;margin:auto}.alert{background:#fff3df;color:#79501c;border:1px solid #f2d9a9;padding:14px;border-radius:15px;line-height:2;margin:12px 0}.card{background:white;border-radius:18px;padding:17px;margin:15px 0;box-shadow:0 4px 17px #2034510d}.section{padding:16px;border-radius:20px;margin:15px 0}.bluebg{background:#eaf2ff}.peach{background:#fff4e8}.greenbg{background:#e9f8ec}.pink{background:#ffeef1}.violet{background:#f2edff}h2{font-size:20px}h3{font-size:17px}label{display:block;margin:12px 0 6px;font-weight:bold}input,select,textarea{width:100%;padding:12px;border:1px solid #c9d4e2;border-radius:12px;background:#fff;color:#17283d;min-width:0}textarea{min-height:105px}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.btn{padding:13px;border-radius:12px;background:#166ad2;color:#fff;font-weight:bold}.btn.green{background:#1d9a5a}.btn.red{background:#c93039;padding:9px}.btn.wide{width:100%;margin:10px 0}.shiftgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.shift{padding:19px 0;border-radius:12px;color:#fff;font-weight:bold}.selected{outline:3px solid #253a59;outline-offset:2px}.phase{background:#e9e9ef;color:#303c4c}.phase.active{background:#7043b6;color:#fff}.action{display:block;width:100%;padding:20px 15px;text-align:right;color:white;font-size:18px;font-weight:bold;border-radius:17px;margin:12px 0;background:#1966c9}.orange{background:#ee7a16}.purple{background:#7041bb}.small{font-size:12px;color:#61728a;line-height:2}.muted{color:#65768c}.minirow{display:grid;grid-template-columns:1.05fr .8fr 1fr 40px;gap:4px;margin:8px 0}.minirow input,.minirow select{padding:8px 4px;font-size:13px}.minirow select{font-size:12px}.minirow{grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr) minmax(0,1fr) 40px}.manage{margin-top:12px}.manage textarea{min-height:150px}.hint{font-size:12px;color:#586a82;line-height:1.8}.check{display:flex;align-items:center;gap:9px}.check input{width:22px;height:22px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;box-shadow:0 -4px 18px #142a4017;padding:10px 4px 14px;z-index:4}.nav button{flex:1;background:transparent;color:#647287;padding:7px 2px;font-size:13px}.nav button.active{color:#1464be;font-weight:bold;background:#edf5ff;border-radius:12px}.nav span{display:block;font-size:22px;margin-bottom:4px}.top{background:#185eb3;color:#fff;padding:16px;font-size:20px;display:flex;gap:12px;align-items:center}.top button{background:#2875d0;color:#fff;padding:8px 13px;border-radius:10px}.error{margin:12px;padding:12px;border:2px solid #e44;background:#fff;color:#a11;white-space:pre-wrap;direction:ltr;text-align:left}
</style></head><body>
<div id="view"><header><h1>گزارش کار انبار شمش</h1><p>مجتمع فولاد خراسان</p></header><main class="wrap"><div class="alert">نسخه V6.2 — پیش‌نویس فقط روی همین گوشی ذخیره می‌شود؛ هنوز اتصال به Supabase و پیامک فعال نیست.</div><div class="card"><h2>انتخاب شیفت</h2><div class="shiftgrid"><button class="shift" style="background:#1f9b61" onclick="setShift('A')">شیفت A</button><button class="shift" style="background:#1768cf" onclick="setShift('B')">شیفت B</button><button class="shift" style="background:#f07815" onclick="setShift('C')">شیفت C</button><button class="shift" style="background:#6b3db8" onclick="setShift('D')">شیفت D</button></div></div><div class="card"><h2>انتخاب فاز گزارش</h2><div class="row"><button class="btn phase" onclick="setPhase('1')">فاز ۱</button><button class="btn phase" onclick="setPhase('2')">فاز ۲</button></div></div><button class="action" onclick="go('form')">＋ ثبت گزارش</button><button class="action orange" onclick="go('notices')">📢 اطلاعیه‌ها</button><button class="action purple" onclick="go('swaps')">⇄ جانشینی و تعویض شیفت</button></main></div>
<nav class="nav"><button data-page="home" onclick="go('home')"><span>⌂</span>خانه</button><button data-page="reports" onclick="go('reports')"><span>▤</span>گزارش‌ها</button><button data-page="stats" onclick="go('stats')"><span>▥</span>آمار</button><button data-page="settings" onclick="go('settings')"><span>⚙</span>تنظیمات</button></nav><div id="diagnostic" aria-live="polite"></div>
<script>
(function(){'use strict';
const el=id=>document.getElementById(id),warning='<div class="alert">نسخه V6.2 — اطلاعات فقط به‌صورت پیش‌نویس روی همین مرورگر ذخیره می‌شوند؛ اتصال Supabase و پیامک هنوز فعال نیست.</div>';
let page='home',phase='1',shift='D',draft={},marks=[{type:'لیبل',count:'',coupe:'C1'}],cuts=[{type:'شمش',count:'',melt:''}];
const PHASE1_COUPES=Array.from({length:6},(_,i)=>'C'+(i+1)),PHASE2_COUPES=['D','K','F','H'].flatMap(a=>Array.from({length:8},(_,i)=>a+(i+1)));
const CUT_TYPES=['شمش','دامی‌بار','ته شمش','خرابی سر و ته'];
const DEFAULT_OPERATORS=["محمدرضا محمدی", "علیرضا جازندری", "حسین دهنوی", "علی عشقی", "حیدر عارفخانی", "حسین کوندری", "حمیدرضا معاشری", "علی خیرآبادی", "محمد خانی", "محمدرضا شورابی", "محمد حسن سیدآبادی", "مصطفی سیدآبادی", "علی مهربانی", "احمد زرگرانی", "محمد عشقی", "حسین سیدآبادی"];
let operators=DEFAULT_OPERATORS.slice();
function options(list,selected){return list.map(x=>'<option value="'+esc(x)+'" '+(x===selected?'selected':'')+'>'+esc(x)+'</option>').join('')}
function coupeList(){return phase==='1'?PHASE1_COUPES:PHASE2_COUPES}
function validCoupe(c){return coupeList().includes(c)?c:coupeList()[0]}
function operatorSelect(){return '<label for="operator">اپراتور برشکاری</label><select id="operator">'+options(operators,draft.operator||operators[0])+'</select>'}

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showError(e){el('diagnostic').innerHTML='<div class="error">خطای برنامه: '+esc(e&&e.message?e.message:e)+'</div>'}
window.addEventListener('error',e=>showError(e.error||e.message));
function safe(fn){return function(){try{return fn.apply(null,arguments)}catch(e){showError(e)}}}
function topBar(t){return '<div class="top"><button onclick="go(\'home\')">❯</button>'+esc(t)+'</div>'}
function field(id,label,type='number'){return '<label for="'+id+'">'+label+'</label><input id="'+id+'" type="'+type+'" '+(type==='number'?'min="0" inputmode="numeric"':'')+' value="'+esc(draft[id]||'')+'">'}
function markRow(m,i){let coupe=validCoupe(m.coupe);m.coupe=coupe;return '<div class="minirow"><select aria-label="نوع مارک" onchange="updateMark('+i+',\'type\',this.value)">'+options(['لیبل','شابلون'],m.type)+'</select><input aria-label="تعداد ذوب" type="number" min="0" placeholder="تعداد" value="'+esc(m.count)+'" oninput="updateMark('+i+',\'count\',this.value)"><select aria-label="کوپه" onchange="updateMark('+i+',\'coupe\',this.value)">'+options(coupeList(),coupe)+'</select><button class="btn red" onclick="removeMark('+i+')">×</button></div>'}
function cutRow(c,i){if(!CUT_TYPES.includes(c.type))c.type='شمش';return '<div class="minirow"><select aria-label="نوع برش" onchange="updateCut('+i+',\'type\',this.value)">'+options(CUT_TYPES,c.type)+'</select><input aria-label="تعداد برش" type="number" min="0" placeholder="تعداد" value="'+esc(c.count)+'" oninput="updateCut('+i+',\'count\',this.value)"><input aria-label="شماره ذوب" placeholder="شماره ذوب" value="'+esc(c.melt)+'" oninput="updateCut('+i+',\'melt\',this.value)"><button class="btn red" onclick="removeCut('+i+')">×</button></div>'}
function stash(){if(!el('produced'))return;['produced','loaded','rolling','operator','notes'].forEach(k=>{if(el(k))draft[k]=el(k).value});['hot','box'].forEach(k=>{if(el(k))draft[k]=el(k).checked});try{localStorage.setItem('shiftreport_v61_draft',JSON.stringify({phase,shift,draft,marks,cuts}))}catch(e){showError(e)}}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let h='';
if(page==='home')h='<header><h1>گزارش کار انبار شمش</h1><p>مجتمع فولاد خراسان</p></header><main class="wrap">'+warning+'<div class="card"><h2>انتخاب شیفت</h2><div class="shiftgrid">'+[['A','#1f9b61'],['B','#1768cf'],['C','#f07815'],['D','#6b3db8']].map(x=>'<button class="shift '+(shift===x[0]?'selected':'')+'" style="background:'+x[1]+'" onclick="setShift(\''+x[0]+'\')">شیفت '+x[0]+'</button>').join('')+'</div></div><div class="card"><h2>انتخاب فاز گزارش</h2><div class="row"><button class="btn phase '+(phase==='1'?'active':'')+'" onclick="setPhase(\'1\')">فاز ۱</button><button class="btn phase '+(phase==='2'?'active':'')+'" onclick="setPhase(\'2\')">فاز ۲</button></div></div><button class="action" onclick="go(\'form\')">＋ ثبت گزارش فاز '+phase+' • شیفت '+shift+'</button><button class="action orange" onclick="go(\'notices\')">📢 اطلاعیه‌ها</button><button class="action purple" onclick="go(\'swaps\')">⇄ جانشینی و تعویض شیفت</button><div class="card"><h2>آخرین گزارش‌ها</h2><p class="muted">نمایش گزارش‌های واقعی نیازمند اتصال امن به سرور است.</p></div></main>';
if(page==='form')h=topBar('ثبت گزارش فاز '+phase+' • شیفت '+shift)+'<main class="wrap">'+warning+'<section class="section bluebg"><h3>⚗ تولید و بارگیری</h3>'+field('produced','تعداد ذوب تولیدشده')+field('loaded','بارگیری ماشین')+'</section><section class="section peach"><h3>▰ ارسال به نورد</h3>'+field('rolling','تعداد ذوب ارسالی')+'</section>'+(phase==='1'?'<section class="section peach"><h3>🔥 عملیات فاز ۱</h3><label class="check"><input id="hot" type="checkbox" '+(draft.hot?'checked':'')+'>هات شارژ انجام شد</label><label class="check"><input id="box" type="checkbox" '+(draft.box?'checked':'')+'>تخلیه باکس انجام شد</label></section>':'')+'<section class="section greenbg"><h3>◆ مارک‌گذاری (لیبل / شابلون)</h3><button class="btn" onclick="addMark()">＋ افزودن مورد</button><div class="small">نوع | تعداد ذوب | کوپه</div><div id="marks">'+marks.map(markRow).join('')+'</div></section><section class="section pink"><h3>✂ برشکاری</h3>'+operatorSelect()+'<div class="small">نوع برش | تعداد | شماره ذوب</div><div id="cuts">'+cuts.map(cutRow).join('')+'</div><button class="btn" style="margin-top:14px" onclick="addCut()">＋ افزودن برش</button></section><section class="section violet"><h3>🔧 اتفاقات / خرابی‌ها / تعمیرات و توضیحات شیفت</h3><textarea id="notes" placeholder="توضیحات شیفت...">'+esc(draft.notes||'')+'</textarea></section><button class="btn green wide" onclick="saveDraft()">ذخیره پیش‌نویس روی گوشی</button><p class="small">ارسال واقعی گزارش هنوز غیرفعال است.</p></main>';
if(page==='operators')h=topBar('مدیریت اپراتورها')+'<main class="wrap">'+warning+'<div class="card"><h2>فهرست اپراتورهای برشکاری</h2><p class="hint">هر نام را در یک خط وارد کنید. این تغییرات فقط روی همین مرورگر ذخیره می‌شوند.</p><textarea id="operatorNames" class="manage">'+esc(operators.join('\n'))+'</textarea><button class="btn green wide" onclick="saveOperators()">ذخیره فهرست اپراتورها</button><button class="btn wide" onclick="resetOperators()">بازگرداندن نام‌های پیش‌فرض</button></div></main>';
if(page==='reports'||page==='stats'||page==='settings'||page==='notices'||page==='swaps'){let names={reports:'گزارش‌ها',stats:'آمار',settings:'تنظیمات',notices:'اطلاعیه‌ها',swaps:'جانشینی و تعویض شیفت'};h=topBar(names[page])+'<main class="wrap">'+warning+'<div class="card"><h2>'+names[page]+'</h2><p>این بخش برای نمایش و ثبت اطلاعات واقعی به اتصال امن Supabase و احراز هویت نیاز دارد.</p></div>'+(page==='settings'?'<button class="btn secondary wide" onclick="go(&quot;operators&quot;)">⚙ مدیریت نام اپراتورها</button><button class="btn wide" onclick="clearDraft()">پاک‌کردن پیش‌نویس</button>':'')+'</main>'}
el('view').innerHTML=h}
window.go=safe(p=>{if(page==='form'&&p!=='form')stash();page=p;render();window.scrollTo(0,0)});
window.setPhase=safe(p=>{phase=p;marks.forEach(m=>m.coupe=validCoupe(m.coupe));render()});window.setShift=safe(s=>{shift=s;render()});
window.updateMark=(i,k,v)=>{if(marks[i])marks[i][k]=v};window.updateCut=(i,k,v)=>{if(cuts[i])cuts[i][k]=v};
window.addMark=safe(()=>{marks.push({type:'لیبل',count:'',coupe:phase==='1'?'C1':'D1'});el('marks').innerHTML=marks.map(markRow).join('')});
window.removeMark=safe(i=>{marks.splice(i,1);el('marks').innerHTML=marks.map(markRow).join('')});
window.addCut=safe(()=>{cuts.push({type:'شمش',count:'',melt:''});el('cuts').innerHTML=cuts.map(cutRow).join('')});
window.removeCut=safe(i=>{cuts.splice(i,1);el('cuts').innerHTML=cuts.map(cutRow).join('')});
window.saveOperators=safe(()=>{let names=el('operatorNames').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);names=[...new Set(names)];if(!names.length){alert('حداقل یک نام اپراتور لازم است');return}operators=names;try{localStorage.setItem('shiftreport_v62_operators',JSON.stringify(operators))}catch(e){showError(e)}if(!operators.includes(draft.operator))draft.operator=operators[0];go('form')});
window.resetOperators=safe(()=>{if(confirm('نام‌های پیش‌فرض بازیابی شوند؟')){operators=DEFAULT_OPERATORS.slice();localStorage.setItem('shiftreport_v62_operators',JSON.stringify(operators));render()}});
window.saveDraft=safe(()=>{stash();alert('پیش‌نویس روی همین گوشی ذخیره شد؛ به سرور ارسال نشده است.')});
window.clearDraft=safe(()=>{if(confirm('پیش‌نویس پاک شود؟')){localStorage.removeItem('shiftreport_v61_draft');draft={};marks=[{type:'لیبل',count:'',coupe:'C1'}];cuts=[{type:'شمش',count:'',melt:''}];render()}});
try{let custom=JSON.parse(localStorage.getItem('shiftreport_v62_operators')||'null');if(Array.isArray(custom)&&custom.length)operators=custom.filter(x=>typeof x==='string'&&x.trim());let saved=JSON.parse(localStorage.getItem('shiftreport_v61_draft')||'null');if(saved){phase=saved.phase||'1';shift=saved.shift||'D';draft=saved.draft||{};if(Array.isArray(saved.marks))marks=saved.marks;if(Array.isArray(saved.cuts))cuts=saved.cuts;marks.forEach(m=>m.coupe=validCoupe(m.coupe));cuts.forEach(c=>{if(!CUT_TYPES.includes(c.type))c.type='شمش'})}}catch(e){showError(e)}
try{render()}catch(e){showError(e)}
})();
</script></body></html>
