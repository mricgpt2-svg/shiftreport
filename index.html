<script>
(function(){'use strict';
const el=id=>document.getElementById(id),warning='';
let editingReportId=null, editingOriginal=null, selectedReportId=null;
let statsPeriod='امروز',statsPhase='all',statsShift='all',statsFrom='',statsTo='',statsMonth='',statsResult=null,statsBusy=false,statsError='';

const PHASE1_COUPES=Array.from({length:6},(_,i)=>'C'+(i+1)),PHASE2_COUPES=['D','K','F','H'].flatMap(a=>Array.from({length:8},(_,i)=>a+(i+1)));
const CUT_TYPES=['شمش','دامی‌بار','ته شمش','خرابی سر و ته'];
const DEFAULT_OPERATORS=["محمدرضا محمدی", "علیرضا جازندری", "حسین دهنوی", "علی عشقی", "حیدر عارفخانی", "حسین کوندری", "حمیدرضا معاشری", "علی خیرآبادی", "محمد خانی", "محمدرضا شورابی", "محمد حسن سیدآبادی", "مصطفی سیدآبادی", "علی مهربانی", "احمد زرگرانی", "محمد عشقی", "حسین سیدآبادی"];
let operators=DEFAULT_OPERATORS.slice();
let operatorsLoaded=false,operatorsBusy=false,operatorsError='';
function options(list,selected){return list.map(x=>'<option value="'+esc(x)+'" '+(x===selected?'selected':'')+'>'+esc(x)+'</option>').join('')}

function stash(){if(!el('produced'))return;['produced','loaded','rolling','operator','notes'].forEach(k=>{if(el(k))draft[k]=el(k).value});['hot','box'].forEach(k=>{if(el(k))draft[k]=el(k).checked});try{localStorage.setItem('shiftreport_v61_draft',JSON.stringify({phase,shift,draft,marks,cuts}))}catch(e){showError(e)}}
function staffRole(){if(!access)return '';const t=String(access.user_type||'').toLowerCase(),r=String(access.role||'').toLowerCase();if(r==='owner')return 'مالک اصلی';return ({supervisor:'سرپرست',chief:'رئیس',expert:'کارشناس',shift:'تکنسین',technician:'تکنسین',operator:'تکنسین'})[t]||({admin:'مدیر',supervisor:'سرپرست',chief:'رئیس',expert:'کارشناس'})[r]||'کاربر'}
function mayRegisterReport(){if(!access)return false;const t=String(access.user_type||'').toLowerCase();return t==='shift'&&!['supervisor','chief','expert'].includes(t)}
function render(){if(page==='boot'){document.querySelector('.nav').style.display='none';el('view').innerHTML='<main class="wrap" style="min-height:75vh;display:flex;align-items:center;justify-content:center"><div class="card" role="status" aria-live="polite" style="text-align:center;width:100%;max-width:420px"><h2>گزارش کار انبار شمش</h2><p class="muted">در حال بررسی ورود...</p></div></main>';return}if(!access&&!['login','otp','pending','inactive'].includes(page))page='login';document.querySelector('.nav').style.display=access?'flex':'none';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let h='';
if(page==='home')h='<header><h1>گزارش کار انبار شمش</h1><p>مجتمع فولاد خراسان</p></header><main class="wrap"><div class="card" style="padding:12px 16px;text-align:right"><span style="font-size:14px;font-weight:600">'+esc(access?.full_name||'')+' • '+esc(staffRole())+'</span></div>'+(mayRegisterReport()?'<div class="card"><h2>انتخاب شیفت</h2><div class="shiftgrid">'+[['A','#1f9b61'],['B','#1768cf'],['C','#f07815'],['D','#6b3db8']].map(x=>'<button class="shift '+(shift===x[0]?'selected':'')+'" style="background:'+x[1]+'" onclick="setShift(&quot;'+x[0]+'&quot;)">شیفت '+x[0]+'</button>').join('')+'</div></div><div class="card"><h2>انتخاب فاز گزارش</h2><div class="row"><button class="btn phase '+(phase==='1'?'active':'')+'" onclick="setPhase(&quot;1&quot;)">فاز ۱</button><button class="btn phase '+(phase==='2'?'active':'')+'" onclick="setPhase(&quot;2&quot;)">فاز ۲</button></div></div><button class="action" onclick="go(&quot;form&quot;)">＋ ثبت گزارش فاز '+phase+' • شیفت '+shift+'</button>':'')+'<button class="action orange" onclick="go(&quot;notices&quot;)">📢 اطلاعیه‌ها</button>'+(mayRegisterReport()?'<button class="action purple" onclick="go(&quot;swaps&quot;)">⇄ جانشینی و تعویض شیفت</button>':'')+'<div class="card"><h2>آخرین گزارش‌ها</h2><div id="recentReports">'+recentReportsHtml()+'</div></div></main>';
if(page==='form')h=topBar((editingReportId?'ویرایش گزارش':'ثبت گزارش')+' فاز '+phase+' • شیفت '+shift)+'<main class="wrap">'+warning+'<section class="section bluebg"><h3>⚗ تولید و بارگیری</h3>'+field('produced','تعداد ذوب تولیدشده')+field('loaded','بارگیری ماشین')+'</section><section class="section peach"><h3>▰ ارسال به نورد</h3>'+field('rolling','تعداد ذوب ارسالی')+'</section>'+(phase==='1'?'<section class="section peach"><h3>🔥 عملیات فاز ۱</h3><label class="check"><input id="hot" type="checkbox" '+(draft.hot?'checked':'')+'>هات شارژ انجام شد</label><label class="check"><input id="box" type="checkbox" '+(draft.box?'checked':'')+'>تخلیه باکس انجام شد</label></section>':'')+'<section class="section greenbg"><h3>◆ مارک‌گذاری (لیبل / شابلون)</h3><button class="btn" onclick="addMark()">＋ افزودن مورد</button><div class="small">نوع | تعداد ذوب | کوپه</div><div id="marks">'+marks.map(markRow).join('')+'</div></section><section class="section pink"><h3>✂ برشکاری</h3>'+operatorSelect()+'<div class="small">نوع برش | تعداد | شماره ذوب</div><div id="cuts">'+cuts.map(cutRow).join('')+'</div><button class="btn" style="margin-top:14px" onclick="addCut()">＋ افزودن برش</button></section><section class="section violet"><h3>🔧 اتفاقات / خرابی‌ها / تعمیرات و توضیحات شیفت</h3><textarea id="notes" placeholder="توضیحات شیفت...">'+esc(draft.notes||'')+'</textarea></section><button class="btn green wide" onclick="submitReport()">'+(editingReportId?'ذخیره تغییرات گزارش':'ثبت و ارسال گزارش به سرور')+'</button><button class="btn wide" onclick="saveDraft()">ذخیره پیش‌نویس روی گوشی</button><p id="submitStatus" class="hint" role="status"></p></main>';
if(page==='pending')h=topBar('در انتظار تأیید مدیر')+'<main class="wrap"><div class="card"><h2>در انتظار تأیید مدیر</h2><p>کد پیامکی تأیید شد، اما این دستگاه هنوز توسط مالک یا مدیر تأیید و فعال نشده است.</p><button class="btn wide" onclick="checkDevice()">بررسی مجدد وضعیت</button><button class="btn secondary wide" onclick="logoutWeb()">خروج</button><p id="deviceStatus" class="hint"></p></div></main>';

function cycleStatusForReport(r){
 const c=['صبح‌کار اول','صبح‌کار دوم','عصرکار اول','عصرکار دوم','شب‌کار اول','شب‌کار دوم','آف اول','آف دوم'];
 const base={A:4,B:6,C:0,D:2}; if(!(r.shift in base))return 'نامشخص';
 // Android V54 anchor: 2026-09-20, using Tehran calendar day.
 let day='';if(r.tehran_time){const d=new Date(r.tehran_time);if(!isNaN(d))day=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tehran',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}
 if(!day){const d=new Date();day=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tehran',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}
 const m=day.match(/(\d{4})-(\d{2})-(\d{2})/);if(!m)return 'نامشخص';
 const diff=Math.round((Date.UTC(+m[1],+m[2]-1,+m[3])-Date.UTC(2026,8,20))/86400000);
 return c[((base[r.shift]+diff)%8+8)%8];
}

async function noticeRpc(fn,args={}){
 const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),20000);
 try{
  const response=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json','x-device-id':browserDeviceId()},body:JSON.stringify(args),signal:controller.signal,cache:'no-store'});
  const raw=await response.text();let data;
  try{data=raw?JSON.parse(raw):null}catch{throw Error('پاسخ سرور قابل خواندن نیست')}
  if(!response.ok)throw Error((data&& (data.message||data.error||data.hint))||'خطای سرور: '+response.status);
  return data;
 }catch(e){if(e.name==='AbortError')throw Error('ارتباط با سرور برقرار نشد؛ دوباره تلاش کنید');throw e}
 finally{clearTimeout(timer)}

 noticeEditorId=n?n.id:null;
 const box=el('noticeList');if(!box)return;
 box.innerHTML='<div class="card"><h2>'+(n?'ویرایش اطلاعیه':'انتشار اطلاعیه')+'</h2><label>عنوان</label><input id="noticeEditTitle" maxlength="160" value="'+esc(n?.title||'')+'"><label>متن اطلاعیه</label><textarea id="noticeEditBody" maxlength="10000" style="min-height:190px">'+esc(n?.body||'')+'</textarea><div id="noticeEditError" class="notice-error"></div><button class="btn green wide" id="noticeSave" onclick="saveNotice()">ذخیره</button><button class="btn secondary wide" onclick="loadNotices()">انصراف</button></div>';
};
window.saveNotice=async function(){
 if(!canPublishNotice())return;
 const title=el('noticeEditTitle')?.value.trim(),body=el('noticeEditBody')?.value.trim(),error=el('noticeEditError'),b=el('noticeSave');
 if(!title||!body){error.textContent='عنوان و متن اطلاعیه را وارد کنید.';return}
 b.disabled=true;error.textContent='';
 try{const result=await noticeRpc(noticeEditorId?'v54_update_notice':'v54_publish_notice',noticeEditorId?{p_notice_id:noticeEditorId,p_title:title,p_body:body}:{p_title:title,p_body:body});
 if(result===false)throw Error('سرور ذخیره را تأیید نکرد');await loadNotices();checkPendingNotices()}
 catch(e){error.textContent='ذخیره انجام نشد: '+e.message;b.disabled=false}
};
window.deleteNotice=async function(id){
 const n=noticeList.find(x=>Number(x.id)===Number(id));if(!n||!canManageNotice(n)||!confirm('این اطلاعیه حذف شود؟'))return;
 try{const r=await noticeRpc('v54_delete_notice',{p_notice_id:id});if(r!==true)throw Error('حذف تأیید نشد');await loadNotices()}
 catch(e){alert('خطا در حذف اطلاعیه: '+e.message)}
};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&access){if(page==='notices'){if(!noticeLoaded&&!noticeLoading)loadNotices();}else checkPendingNotices()}});

window.saveDraft=safe(()=>{if(!access){page='login';render();return}stash();alert('پیش‌نویس روی همین گوشی ذخیره شد؛ به سرور ارسال نشده است.')});
window.clearDraft=safe(()=>{if(confirm('پیش‌نویس پاک شود؟')){localStorage.removeItem('shiftreport_v61_draft');draft={};marks=[{type:'لیبل',count:'',coupe:'C1'}];cuts=[{type:'شمش',count:'',melt:''}];render()}});
try{let saved=JSON.parse(localStorage.getItem('shiftreport_v61_draft')||'null');if(saved){phase=saved.phase||'1';shift=saved.shift||'D';draft=saved.draft||{};if(Array.isArray(saved.marks))marks=saved.marks;if(Array.isArray(saved.cuts))cuts=saved.cuts;marks.forEach(m=>m.coupe=validCoupe(m.coupe));cuts.forEach(c=>{if(!CUT_TYPES.includes(c.type))c.type='شمش'})}}catch(e){showError(e)}
try{if(hasRememberedDevice()){page='boot';render();checkDevice().catch(e=>{page='login';render();showError(e)})}else{page='login';render()}}catch(e){page='login';render();showError(e)}
})();
</script></body></html>
