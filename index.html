<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1565c0"><title>گزارش کار انبار شمش V6</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#182c47;font-family:Tahoma,Arial,sans-serif;padding-bottom:92px}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}header{background:linear-gradient(110deg,#27313a,#f16d00);color:white;padding:40px 18px 30px;border-radius:0 0 28px 28px;text-align:center}h1{font-size:27px}header p{font-weight:bold}.wrap{padding:16px;max-width:780px;margin:auto}.alert{background:#fff3df;color:#79501c;border:1px solid #f2d9a9;padding:15px;border-radius:17px;margin:12px 0;line-height:2}.card{background:white;border-radius:20px;padding:18px;margin:16px 0;box-shadow:0 5px 20px #2034510d}.section{padding:18px;border-radius:23px;margin:16px 0}.bluebg{background:#eaf2ff}.peach{background:#fff4e8}.greenbg{background:#e9f8ec}.pink{background:#ffeef1}.violet{background:#f2edff}h2{font-size:21px;margin:12px 0 18px}h3{margin:2px 0 14px}label{display:block;margin:12px 0 6px;font-weight:bold}input,select,textarea{width:100%;padding:13px;border:1px solid #c9d4e2;border-radius:13px;background:white;color:#17283d;min-width:0}textarea{min-height:100px;resize:vertical}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1;min-width:0}.btn{padding:15px;border-radius:14px;background:#166ad2;color:white;font-weight:bold}.btn.secondary{background:#6742b9}.btn.green{background:#1d9a5a}.btn.red{background:#c93039;flex:0 0 44px}.btn.wide{width:100%;margin:9px 0}.btn:disabled{opacity:.5}.shiftgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.shift{padding:20px 0;border-radius:14px;color:white;font-weight:bold;text-align:center}.phase{background:#eee;color:#303c4c}.phase.active{background:#7043b6;color:white}.action{display:block;width:100%;padding:22px 15px;text-align:right;color:white;font-size:20px;font-weight:bold;border-radius:19px;margin:12px 0;background:#1966c9}.action.orange{background:#ee7a16}.action.purple{background:#7041bb}.small{font-size:12px;color:#61728a;line-height:2}.muted{color:#65768c}.minirow{display:grid;grid-template-columns:1.05fr .8fr 1fr 44px;gap:4px;margin:8px 0}.minirow input,.minirow select{padding:9px 5px;font-size:14px}.check{display:flex;align-items:center;gap:10px;margin:14px 0}.check input{width:22px;height:22px}.nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;box-shadow:0 -4px 18px #142a4017;padding:10px 4px max(12px,env(safe-area-inset-bottom));z-index:4}.nav button{flex:1;background:transparent;color:#647287;padding:8px 2px;font-size:13px}.nav button.active{color:#1464be;font-weight:bold;background:#edf5ff;border-radius:13px}.nav span{display:block;font-size:22px;margin-bottom:5px}.top{background:#185eb3;color:white;padding:18px;font-size:21px;font-weight:bold;display:flex;align-items:center;gap:12px}.top button{background:#2875d0;color:white;padding:8px 14px;border-radius:12px}.hidden{display:none}.record{border-bottom:1px solid #ddd;padding:13px 0;line-height:2}button:focus-visible,input:focus-visible{outline:3px solid #6ca7e8}
</style></head><body><div id="view"></div><nav class="nav"><button data-page="home" onclick="go('home')"><span>⌂</span>خانه</button><button data-page="reports" onclick="go('reports')"><span>▤</span>گزارش‌ها</button><button data-page="stats" onclick="go('stats')"><span>▥</span>آمار</button><button data-page="settings" onclick="go('settings')"><span>⚙</span>تنظیمات</button></nav><script>
const $=id=>document.getElementById(id);let page='home',phase='1',shift='D';let marks=[{type:'لیبل',count:'',coupe:'C1'}],cuts=[{type:'شمش',count:'',melt:''}];let draft={};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const warning='<div class="alert">◉ نسخه V6 — فرم‌های کامل و قابل ویرایش. اطلاعات فقط به‌صورت پیش‌نویس روی همین مرورگر ذخیره می‌شوند؛ هنوز به Supabase یا پیامک متصل نیست.</div>';
function go(p){if(page==='form'&&p!=='form')stash();page=p;render();window.scrollTo(0,0)}function setPhase(p){phase=p;render()}function setShift(s){shift=s;render()}function top(t){return `<div class="top"><button onclick="go('home')">❯</button>${t}</div>`}function rowMark(i,m){return `<div class="minirow"><select aria-label="نوع مارک" onchange="marks[${i}].type=this.value"><option ${m.type==='لیبل'?'selected':''}>لیبل</option><option ${m.type==='شابلون'?'selected':''}>شابلون</option></select><input aria-label="تعداد ذوب" type="number" min="0" placeholder="تعداد" value="${esc(m.count)}" oninput="marks[${i}].count=this.value"><input aria-label="کوپه" value="${esc(m.coupe)}" oninput="marks[${i}].coupe=this.value"><button class="btn red" onclick="removeMark(${i})">×</button></div>`}function rowCut(i,c){return `<div class="minirow"><select aria-label="نوع برش" onchange="cuts[${i}].type=this.value"><option ${c.type==='شمش'?'selected':''}>شمش</option><option ${c.type==='سایر'?'selected':''}>سایر</option></select><input aria-label="تعداد برش" type="number" min="0" placeholder="تعداد" value="${esc(c.count)}" oninput="cuts[${i}].count=this.value"><input aria-label="شماره ذوب" placeholder="شماره ذوب" value="${esc(c.melt)}" oninput="cuts[${i}].melt=this.value"><button class="btn red" onclick="removeCut(${i})">×</button></div>`}function addMark(){marks.push({type:'لیبل',count:'',coupe:phase==='1'?'C1':'D1'});refreshRows()}function removeMark(i){marks.splice(i,1);refreshRows()}function addCut(){cuts.push({type:'شمش',count:'',melt:''});refreshRows()}function removeCut(i){cuts.splice(i,1);refreshRows()}function refreshRows(){if($('marks'))$('marks').innerHTML=marks.map((m,i)=>rowMark(i,m)).join('');if($('cuts'))$('cuts').innerHTML=cuts.map((c,i)=>rowCut(i,c)).join('')}
function stash(){if(!$('produced'))return;for(const k of ['produced','loaded','rolling','operator','notes'])draft[k]=$(k).value;for(const k of ['hot','box'])if($(k))draft[k]=$(k).checked;localStorage.setItem('shiftreport_v6_draft',JSON.stringify({phase,shift,draft,marks,cuts}))}function saveDraft(){stash();alert('پیش‌نویس فقط روی همین مرورگر ذخیره شد؛ گزارشی به سرور ارسال نشده است.')}function input(id,title,type='number'){return `<label for="${id}">${title}</label><input id="${id}" type="${type}" ${type==='number'?'min="0" inputmode="numeric"':''} value="${esc(draft[id]||'')}">`}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let h='';if(page==='home')h=`<header><h1>گزارش کار انبار شمش</h1><p>مجتمع فولاد خراسان</p></header><main class="wrap">${warning}<div class="shiftgrid">${[['A','#1f9b61'],['B','#1768cf'],['C','#f07815'],['D','#6b3db8']].map(([s,c])=>`<button class="shift" style="background:${c};outline:${shift===s?'3px solid #253a59':'none'}" onclick="setShift('${s}')">شیفت ${s}</button>`).join('')}</div><div class="card"><h2>انتخاب فاز گزارش</h2><div class="row"><button class="btn phase ${phase==='1'?'active':''}" onclick="setPhase('1')">فاز ۱</button><button class="btn phase ${phase==='2'?'active':''}" onclick="setPhase('2')">فاز ۲</button></div></div><button class="action" onclick="go('form')">＋ ثبت گزارش فاز ${phase} • شیفت ${shift}</button><button class="action orange" onclick="go('notices')">📢 اطلاعیه‌ها</button><button class="action purple" onclick="go('swaps')">⇄ جانشینی و تعویض شیفت</button><div class="card"><h2>آخرین گزارش‌ها</h2><p class="muted">برای دریافت گزارش‌های واقعی باید اتصال امن سرور فعال شود.</p></div></main>`;
if(page==='form')h=`${top('ثبت گزارش فاز '+phase+' • شیفت '+shift)}<main class="wrap">${warning}<h2>اطلاعات اصلی</h2><section class="section bluebg"><h3>⚗ تولید و بارگیری</h3>${input('produced','تعداد ذوب تولیدشده')}${input('loaded','بارگیری ماشین')}</section><section class="section peach"><h3>▰ ارسال به نورد</h3>${input('rolling','تعداد ذوب ارسالی')}</section>${phase==='1'?`<section class="section peach"><h3>🔥 عملیات فاز ۱</h3><label class="check"><input id="hot" type="checkbox" ${draft.hot?'checked':''}>هات شارژ انجام شد</label><label class="check"><input id="box" type="checkbox" ${draft.box?'checked':''}>تخلیه باکس انجام شد</label></section>`:''}<section class="section greenbg"><h3>◆ مارک‌گذاری ذوب (لیبل / شابلون)</h3><button class="btn" onclick="addMark()">＋ افزودن مورد</button><div class="small">نوع | تعداد ذوب | کوپه</div><div id="marks">${marks.map((m,i)=>rowMark(i,m)).join('')}</div></section><section class="section pink"><h3>✂ برشکاری</h3><button class="btn" onclick="addCut()">＋ افزودن برش</button>${input('operator','اپراتور برشکاری','text')}<div class="small">نوع برش | تعداد | شماره ذوب</div><div id="cuts">${cuts.map((c,i)=>rowCut(i,c)).join('')}</div></section><section class="section violet"><h3>🔧 اتفاقات / خرابی‌ها / تعمیرات و توضیحات شیفت</h3><textarea id="notes" placeholder="توضیحات شیفت را وارد کنید...">${esc(draft.notes||'')}</textarea></section><button class="btn green wide" onclick="saveDraft()">▣ ذخیره پیش‌نویس روی گوشی</button><p class="small">برای جلوگیری از ثبت اطلاعات آزمایشی، ارسال واقعی گزارش غیرفعال است.</p></main>`;
if(page==='reports')h=`${top('گزارش‌ها')}<main class="wrap">${warning}<div class="card"><h2>گزارش‌های فاز ۱ و ۲</h2><p>در نسخه بعد، اطلاعات مشترک اندروید و آیفون از Supabase دریافت می‌شود.</p></div></main>`;
if(page==='stats')h=`${top('آمار')}<main class="wrap">${warning}<div class="card"><h2>آمار تولید و بارگیری</h2><p>آمار واقعی پس از اتصال سرور نمایش داده می‌شود.</p></div></main>`;
if(page==='settings')h=`${top('تنظیمات')}<main class="wrap">${warning}<div class="card"><h2>ورود کاربران</h2><p>ورود با شماره موبایل و کد ۴ رقمی IPPanel در این نسخه هنوز فعال نیست.</p></div><button class="btn wide" onclick="clearDraft()">پاک‌کردن پیش‌نویس محلی</button></main>`;
if(page==='notices'||page==='swaps')h=`${top(page==='notices'?'اطلاعیه‌ها':'جانشینی و تعویض شیفت')}<main class="wrap">${warning}<div class="card"><p>نمایش و ثبت واقعی این بخش به احراز هویت و سطح دسترسی سرور نیاز دارد.</p></div></main>`;
$('view').innerHTML=h}function clearDraft(){if(confirm('پیش‌نویس پاک شود؟')){localStorage.removeItem('shiftreport_v6_draft');draft={};marks=[{type:'لیبل',count:'',coupe:'C1'}];cuts=[{type:'شمش',count:'',melt:''}];render()}}try{let saved=JSON.parse(localStorage.getItem('shiftreport_v6_draft')||'null');if(saved){phase=saved.phase||'1';shift=saved.shift||'D';draft=saved.draft||{};marks=saved.marks||marks;cuts=saved.cuts||cuts}}catch(e){}render();
</script></body></html>
